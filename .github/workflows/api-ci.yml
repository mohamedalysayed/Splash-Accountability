name: API CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dashboard/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'dashboard/**'
      - '**/*.md'

jobs:
  test:
    name: Import smoke + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile-check all modules
        run: python -m compileall -q .
      - name: Import the FastAPI app
        env:
          JWT_SECRET: ci-test-secret
          ANTHROPIC_API_KEY: ci-test
          MESSAGING_MODE: console
        run: python -c "from webhook import app; print('app routes:', len(app.routes))"
