name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'

jobs:
  build:
    name: Lint + Type-check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Lint is advisory — Next 16's eslint-config surfaced ~200 pre-existing
      # warnings/errors. Type-check + build are the real gates.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://splash-accountability-api.fly.dev
